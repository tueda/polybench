[package]
name = "polybench-symbolica"
version = "0.1.0"
authors = ["Takahiro Ueda <t.ueda.od@juntendo.ac.jp>"]
edition = "2024"
rust-version = "1.89"

[dependencies]
symbolica = "3.0.0"

# Match Symbolica's release profile; dependency profiles are ignored by Cargo.
[profile.release]
opt-level = 3
codegen-units = 1
lto = true
